packages:
  - apps/*
  - packages/*
  - workers/*

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
  - "@better-auth/core@1.6.25"
  - "@better-auth/drizzle-adapter@1.6.25"
  - "@better-auth/kysely-adapter@1.6.25"
  - "@better-auth/memory-adapter@1.6.25"
  - "@better-auth/mongo-adapter@1.6.25"
  - "@better-auth/prisma-adapter@1.6.25"
  - "@better-auth/telemetry@1.6.25"
  - auth@1.6.25
  - better-auth@1.6.25

onlyBuiltDependencies:
  - esbuild
  - workerd

overrides:
  "@babel/core": 7.29.6
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  brace-expansion@<=5.0.7: 5.0.8
  js-yaml: 4.3.0
  lodash: 4.18.1
  neonctl>@hono/node-server: 2.0.10
  neonctl>diff: 5.2.2
  postcss: 8.5.22
  sharp: 0.35.3
  tmp: 0.2.7
  uuid: 11.1.1
  ws: 8.21.0

patchedDependencies:
  brace-expansion@5.0.8: patches/brace-expansion@5.0.8.patch

verifyDepsBeforeRun: false
