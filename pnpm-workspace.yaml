  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "brace-expansion@<2": 1.1.16
  "brace-expansion@>=3 <5.0.7": 5.0.7
  js-yaml: 4.3.0
  lodash: 4.18.1
  postcss: 8.5.22
  sharp: 0.35.3
  tmp: 0.2.7
  uuid: 11.1.1
