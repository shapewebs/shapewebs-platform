name: Staging reliability and security

on:
  push:
    branches:
      - staging
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: staging-assurance
  cancel-in-progress: false

jobs:
  staging:
    name: k6 smoke and ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_STAGING_URL: ${{ vars.SHAPEWEBS_ADMIN_STAGING_URL }}
      PUBLIC_STAGING_URL: ${{ vars.SHAPEWEBS_STAGING_URL }}
      SHAPEWEBS_STAGING_HOSTS: ${{ vars.SHAPEWEBS_STAGING_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Wait for the fixed staging deployments
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHAPEWEBS_DEPLOYMENT_SHA: ${{ github.sha }}
          SHAPEWEBS_REQUIRED_DEPLOYMENT_CONTEXTS: Vercel – shapewebs-web,Vercel – shapewebs-admin
        run: node tooling/scripts/wait-for-github-statuses.mjs

      - name: Require an exact staging target
        env:
          ADMIN_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          PUBLIC_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$ADMIN_VERCEL_AUTOMATION_BYPASS_SECRET" ]]
          [[ -n "$ADMIN_STAGING_URL" ]]
          [[ -n "$PUBLIC_VERCEL_AUTOMATION_BYPASS_SECRET" ]]
          [[ -n "$PUBLIC_STAGING_URL" ]]
          [[ -n "$SHAPEWEBS_STAGING_HOSTS" ]]

      - name: Install checksum-verified k6
        env:
          K6_ARCHIVE_SHA256: 295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a
          K6_VERSION: v2.1.0
        run: |
          set -euo pipefail
          archive="/tmp/k6-${K6_VERSION}-linux-amd64.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --silent \
            --show-error \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          echo "${K6_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          echo "/tmp/k6-${K6_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Run k6 public staging smoke thresholds
        env:
          K6_TARGET_URL: ${{ env.PUBLIC_STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node tooling/scripts/run-k6-smoke.mjs

      - name: Run k6 admin staging smoke thresholds
        env:
          K6_TARGET_URL: ${{ env.ADMIN_STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
        run: node tooling/scripts/run-k6-smoke.mjs

      - name: Run passive ZAP baseline against public staging
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZAP_TARGET_URL: ${{ env.PUBLIC_STAGING_URL }}
        run: node tooling/scripts/run-zap-baseline.mjs

      - name: Run passive ZAP baseline against admin staging
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_ADMIN_AUTOMATION_BYPASS_SECRET }}
          ZAP_TARGET_URL: ${{ env.ADMIN_STAGING_URL }}
        run: node tooling/scripts/run-zap-baseline.mjs

      - name: Upload redacted staging reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-assurance-reports
          if-no-files-found: ignore
          path: |
            test-results/k6
            test-results/zap
          retention-days: 14
